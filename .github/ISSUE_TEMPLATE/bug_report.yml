name: Bug report
description: Something doesn't work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting! **Never paste your config.json, Streamer.bot / OBS / Spotify passwords or keys, phone QR links or stream keys.**"
  - type: dropdown
    id: part
    attributes: { label: Which part?, options: [Chat display, Replies / suggestions, Text-to-speech, Phone view, Installer / uninstaller, Other] }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: What you did, what you expected, and what happened instead. }
    validations: { required: true }
  - type: input
    id: versions
    attributes: { label: Versions, placeholder: "1.0.0, Windows 11 24H2, OBS 32.2.2, Streamer.bot 1.0.7" }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "The *Recent events* from http://localhost:8767/diag and the end of %LOCALAPPDATA%\\IXC-OBS\\ixc-core.log (remove anything private)."
      render: text
