name: Release
on:
  push:
    tags: ["v*.*.*"]
  # "Run workflow" on the Actions page: (re)build and attach the files of a release, e.g. after a failed run.
  # It builds the default branch, whose VERSION must match the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v3.0.1"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Check tag matches VERSION
        shell: powershell
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          $t = "${{ inputs.tag || github.ref_name }}"
          if ("v$v" -ne $t) { throw "Tag $t does not match VERSION $v - set VERSION to $($t.TrimStart('v')) first" }
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Test + build ZIP and installer
        shell: powershell
        env:
          IXC_RELAY_URL: ${{ vars.IXC_RELAY_URL }}
          IXC_TWITCH_CLIENT_ID: ${{ vars.IXC_TWITCH_CLIENT_ID }}
          IXC_GOOGLE_CLIENT_ID: ${{ vars.IXC_GOOGLE_CLIENT_ID }}
          IXC_KICK_CLIENT_ID: ${{ vars.IXC_KICK_CLIENT_ID }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\build.ps1 -Installer
      - name: Clean-machine test of the installer before publishing
        shell: powershell
        run: |
          $setup = Get-ChildItem dist -Filter 'IXC-Setup-v*.exe' | Select -First 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\smoke.ps1 -Setup $setup.FullName
      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $t = "${{ inputs.tag || github.ref_name }}"; $notes = "docs\release-notes\$t.md"
          $files = Get-ChildItem dist -File | % FullName
          # Windows PowerShell 5.1 turns redirected stderr of a native command into a terminating error under "Stop": a release that
          # does not exist yet (gh prints "release not found") then failed this step. This step therefore runs with "Continue" and
          # checks the exit codes itself; a failure is written as an annotation so it can be read without the run log.
          $ErrorActionPreference = 'Continue'
          gh release view $t *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) { gh release upload $t $files --clobber; exit $LASTEXITCODE }   # release already made by hand: refresh its files
          if (Test-Path $notes) { $out = gh release create $t $files --title "IXC $t" --notes-file $notes 2>&1 | Out-String }
          else { $out = gh release create $t $files --title "IXC $t" --generate-notes 2>&1 | Out-String }
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::gh release create failed: $out"; exit 1 }
          Write-Host $out
