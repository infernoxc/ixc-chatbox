<html lang="en">
<head>
<meta charset="utf-8">
<title>IXC ChatBox - TTS</title>
<!-- OBS browser source: http://localhost:8767/chat/tts.html  ("Control audio via OBS" ON; choose its tracks in Advanced Audio Properties)
     Plays the chat messages IXC decides to read (TTS ON/OFF, filters and queue live in IXC itself). Audio only - nothing visible. -->
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<script src="/core/ixc.js"></script>
<script>
const q = new URLSearchParams(location.search), VOL = Math.min(1, +(q.get('vol') || 1));
let audio = null, playing = 0;
window.ixcTts = { played: 0, failed: 0, last: 0 };
const link = IXC.connect({ role: 'tts', topics: ['tts.play', 'reload'], on: (m) => {
  if (m.type === 'tts.play') play(m); else if (m.type === 'tts.stop') stop();
} });
function release() { if (!audio) return; audio.onended = audio.onerror = null; try { audio.pause(); } catch (e) {} audio.removeAttribute('src'); try { audio.load(); } catch (e) {} audio = null; }   // frees the decoder + buffer
function done(n, ok, err) { if (playing !== n) return; playing = 0; release(); if (ok) window.ixcTts.played++; else window.ixcTts.failed++; link.send({ type: 'tts.done', n, ok, error: err || '' }); }
function play(m) {
  if (playing) done(playing, false, 'replaced'); playing = m.n; window.ixcTts.last = m.n;
  audio = new Audio(m.url); audio.volume = Math.max(0, Math.min(1, VOL * ((m.volume ?? 100) / 100)));
  audio.onended = () => done(m.n, true); audio.onerror = () => done(m.n, false, 'audio error');
  audio.play().catch((e) => { if (e && e.name === 'NotAllowedError') blocked(); done(m.n, false, String(e && e.name || e)); });
}
// OBS plays audio by itself. A normal browser tab needs one click first (autoplay rule), so say so instead of failing silently.
function blocked() { if (document.getElementById('unlock')) return; const b = document.createElement('button'); b.id = 'unlock';
  b.textContent = '🔊 Click once to let this tab play the chat voice (OBS doesn\'t need this)'; b.style.cssText = 'margin:20px;padding:14px 18px;font:600 15px Segoe UI,sans-serif;border-radius:10px;border:0;background:#e3141e;color:#fff;cursor:pointer';
  b.onclick = () => { b.remove(); new Audio().play().catch(() => {}); }; document.body.appendChild(b); }
function stop() { if (playing) { playing = 0; release(); } }
</script>
</body>
</html>
