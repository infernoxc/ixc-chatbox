<!DOCTYPE html>
<!-- Part of IXC - https://github.com/infernoxc/ixc-chatbox  Copyright (c) 2026 Ishan (InFerNoxC) - MIT License -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IXC Chat</title>
<!-- OBS panel (dock): http://localhost:8767/chat/chat.html?dock=1   (IXC adds it to OBS by itself)
     The on-stream chat overlay moved to /overlay/chat.html; old overlay links (without dock=1) are forwarded there. -->
<script>if (!/[?&](dock|bg)=/.test(location.search)) location.replace('/overlay/chat.html' + location.search);</script>
<link rel="stylesheet" href="/core/ui.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font-size: var(--size, 14px); }
  header { background: var(--bg2); border-bottom: 2px solid var(--red); padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; flex: none; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .chip { font: 600 11px var(--font); border-radius: 999px; padding: 3px 9px 3px 7px; background: var(--card2); border: 1px solid var(--line2); color: var(--dim); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim2); } .chip.st-connected i { background: var(--ok); } .chip.st-reconnecting i, .chip.st-connecting i { background: var(--warn); } .chip.st-auth i, .chip.st-error i { background: var(--err); } .chip.st-unavailable i { background: var(--info); }
  .chip.hide { opacity: .45; text-decoration: line-through; } .chip b { color: var(--text); font-weight: 700; }
  .chip.total { margin-left: auto; cursor: default; } .chip.total b { color: #fff; }
  #ttsbar { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 12px; } #ttsbar select { width: auto; max-width: 160px; padding: 4px 6px; font-size: 12px; } #ttsbar button { padding: 4px 8px; font-size: 12px; }
  #ttsbar .sp { flex: 1; } #qn { color: var(--dim); font-size: 11px; }
  #list { flex: 1; overflow-y: auto; padding: 6px 8px 10px; scroll-behavior: auto; }
  .msg { display: flex; gap: .55em; align-items: flex-start; background: var(--card); border: 1px solid #ffffff0a; border-left: 3px solid var(--p); border-radius: 8px; padding: .4em .55em; margin-top: .35em; cursor: pointer; }
  .msg:hover { border-color: #ffffff22; border-left-color: var(--p); } .msg.dim { opacity: .5; } .msg.me { background: #1d1a26; }
  .msg.alert { background: linear-gradient(90deg, #2a1d10, var(--card)); border-left-color: #ffb547; cursor: default; } .msg.alert .text { color: #ffd9a0; }
  .msg.sys { background: transparent; border: 1px dashed var(--line2); color: var(--dim); font-size: .9em; cursor: default; }
  .av { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--p); display: grid; place-items: center; font-weight: 700; font-size: .85em; color: #fff; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .body { min-width: 0; line-height: 1.35; overflow-wrap: anywhere; flex: 1; }
  .name { font-weight: 700; color: var(--n, var(--p)); margin-right: .35em; } .role { font-size: .8em; margin-right: .2em; }
  .flag { font-size: 10px; color: var(--warn); margin-left: .4em; border: 1px solid #574420; border-radius: 4px; padding: 0 4px; }
  .em { height: 1.6em; vertical-align: middle; margin: -.3em .05em; }
  .twitch { --p: var(--tw); } .kick { --p: var(--kick); } .youtube { --p: var(--yt); } .rumble { --p: var(--rumble); } .test { --p: #777; }
  .kick .av, .rumble .av { color: #0a0a0a; }
  #newbtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; display: none; z-index: 5; }
  #newbtn.show { display: inline-flex; }
  #composer { flex: none; background: var(--bg2); border-top: 2px solid var(--red); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center; }
  #plat { flex: none; } #plat.twitch { background: var(--tw); border-color: var(--tw); color: #fff; } #plat.kick { background: var(--kick); border-color: var(--kick); color: #0a0a0a; } #plat.youtube { background: var(--yt); border-color: var(--yt); color: #fff; } #plat.all { background: var(--red); border-color: var(--red); color: #fff; }
  #sug { display: none; position: absolute; left: 8px; right: 8px; bottom: 54px; z-index: 9; max-height: 46vh; overflow-y: auto; background: var(--card2); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow); }
  #sug.show { display: block; } #sug .s { padding: 7px 10px; display: flex; gap: 8px; align-items: center; cursor: pointer; } #sug .s.sel, #sug .s:hover { background: #2a2833; } #sug .s small { margin-left: auto; color: var(--dim); }
  #menu { position: fixed; z-index: 20; display: none; background: var(--card2); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; min-width: 200px; max-width: calc(100vw - 12px); }
  #menu button { white-space: normal; text-align: left; }
  #menu.show { display: block; } #menu button { width: 100%; justify-content: flex-start; background: transparent; border-color: transparent; } #menu button:hover { background: #2a2833; }
  #menu .h { padding: 4px 10px 6px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  #conn { position: absolute; top: 8px; right: 10px; z-index: 6; display: none; } #conn.show { display: inline-flex; }
  main { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
</style>
</head>
<body>
<header>
  <div class="chips" id="chips" aria-label="Platforms (click to show or hide in this panel)"></div>
  <div id="ttsbar">
    <button id="ttsBtn" title="Read chat out loud (viewers hear it)">🔈 Voice off</button>
    <button id="pauseBtn" title="Pause / resume the chat voice">⏸</button>
    <select id="ttsVoice" title="Default voice" aria-label="Default voice"></select>
    <span id="qn"></span><span class="sp"></span>
    <button id="skipBtn" title="Stop the message being read now">Skip</button>
    <button id="appBtn" title="Open the IXC dashboard (settings, phone, overlays, system check)">⚙ IXC</button>
  </div>
</header>
<main>
  <span id="conn" class="pill st-reconnecting"><i></i>IXC not running</span>
  <div id="list" class="scroll" aria-live="polite"></div>
  <button id="newbtn" class="primary small">↓ new messages</button>
  <div id="sug"></div>
</main>
<div id="composer">
  <button id="plat" class="all" title="Where to send (click to change)">ALL</button>
  <input id="msgIn" type="text" autocomplete="off" maxlength="480" placeholder="Reply to chat…  ( ! commands · @ people )" aria-label="Reply to chat">
  <button id="sendBtn" class="primary">Send</button>
</div>
<div id="menu" role="menu"></div>
<script src="/core/ixc.js"></script>
<script src="/core/ui.js"></script>
<script>
(() => {
  const { $, esc, P, toast } = UI;
  const q = new URLSearchParams(location.search), MAX = +(q.get('max') || 200);
  if (q.get('size')) document.body.style.setProperty('--size', (+q.get('size')) + 'px');
  const list = $('list'); let follow = true, plats = {}, viewers = null, settings = {}, voices = [], tts = null, hideP = new Set(), sendTargets = ['all'], tIdx = 0;
  // ---------- scrolling: follow new messages unless you scrolled up ----------
  const atBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 40;
  list.addEventListener('scroll', () => { follow = atBottom(); if (follow) $('newbtn').classList.remove('show'); });
  $('newbtn').onclick = () => { follow = true; list.scrollTop = list.scrollHeight; $('newbtn').classList.remove('show'); };
  const toBottom = () => { if (follow) requestAnimationFrame(() => { list.scrollTop = list.scrollHeight; }); else $('newbtn').classList.add('show'); };
  // ---------- messages ----------
  function add(m) {
    const el = document.createElement('div'); const alert = m.kind && m.kind !== 'chat';
    el.className = 'msg ' + (P[m.platform] ? m.platform : 'test') + (alert ? ' alert' : '') + (m.hidden ? ' dim' : '') + (m.me ? ' me' : '');
    el.dataset.p = m.platform; el.dataset.id = m.id || ''; el.dataset.login = (m.login || m.name || '').toLowerCase(); el.dataset.name = m.name || '';
    const r = m.roles || {}; const role = (r.broadcaster ? '👑' : '') + (r.mod ? '🛡️' : '') + (r.vip ? '💎' : '') + (r.sub ? '⭐' : '');
    const av = m.avatar && /^https:/.test(m.avatar) ? `<img src="${esc(m.avatar)}" alt="" loading="lazy" onerror="this.remove()">` : esc((m.name || '?')[0].toUpperCase());
    const text = alert ? esc((m.text || m.kind) + (m.amount ? ' · ' + m.amount : '')) : UI.msgHtml(m);
    const flags = (m.flags || []).filter(f => f !== 'action').map(f => `<span class="flag" title="${m.hidden ? 'Hidden from the on-stream overlay' : 'Not read out loud'}">${esc(f)}</span>`).join('');
    el.innerHTML = `<div class="av">${av}</div><div class="body"><span class="tag ${esc(m.platform)}">${esc((P[m.platform] || P.test).tag)}</span> <span class="role">${role}</span><span class="name" ${m.color && /^#[0-9a-f]{3,8}$/i.test(m.color) ? `style="--n:${m.color}"` : ''}>${esc(m.name || 'someone')}</span>${alert ? '' : ''}<span class="text">${text}</span>${flags}</div>`;
    if (hideP.has(m.platform)) el.style.display = 'none';
    list.appendChild(el); while (list.children.length > MAX) list.firstChild.remove(); toBottom(); }
  function sys(text, bad) { const el = document.createElement('div'); el.className = 'msg sys'; el.innerHTML = `<div class="body ${bad ? 'warn' : ''}">${esc(text)}</div>`; list.appendChild(el); toBottom(); }
  function del(p, id, login) { list.querySelectorAll('.msg').forEach(el => { if (el.dataset.p === p && ((id && el.dataset.id === id) || (!id && login && el.dataset.login === String(login).toLowerCase()))) el.remove(); }); }
  // ---------- platforms + viewers ----------
  function paintChips() {
    const order = ['twitch', 'kick', 'youtube', 'rumble'];
    let h = order.filter(p => plats[p] && plats[p].configured).map(p => { const s = plats[p]; const v = viewers && viewers.platforms && viewers.platforms[p];
      const n = v && v.state === 'live' ? `<b>${UI.num(v.count)}</b>` : v && v.state === 'offline' ? '<span class="tiny">offline</span>' : '';
      return `<span class="chip st-${esc(s.state)} ${hideP.has(p) ? 'hide' : ''}" data-p="${p}" title="${esc(P[p].name + ': ' + (UI.STATE[s.state] || s.state) + (s.detail ? ' - ' + s.detail : '') + (s.canSend ? '' : '\n' + (s.sendNote || '')))} (click: show/hide here)"><i></i>${P[p].name} ${n}</span>`; }).join('');
    if (!h) h = '<span class="muted small">No platform connected yet - <a href="#" id="setupLink">connect your accounts</a></span>';
    const tot = viewers && viewers.total != null ? `<span class="chip total" title="Viewers on all platforms${viewers.partial ? ' (some platforms have no number right now)' : ''}">👁 <b>${UI.num(viewers.total)}</b>${viewers.partial ? '*' : ''}</span>` : '';
    $('chips').innerHTML = h + tot;
    const sl = $('setupLink'); if (sl) sl.onclick = (e) => { e.preventDefault(); openApp('#accounts'); };
    sendTargets = ['all'].concat(order.filter(p => plats[p] && plats[p].canSend)); if (!sendTargets.includes(sendTargets[tIdx])) tIdx = 0; paintPlat(); }
  $('chips').onclick = (e) => { const c = e.target.closest('.chip[data-p]'); if (!c) return; const p = c.dataset.p; if (hideP.has(p)) hideP.delete(p); else hideP.add(p);
    list.querySelectorAll('.msg[data-p="' + p + '"]').forEach(el => el.style.display = hideP.has(p) ? 'none' : ''); paintChips();
    link.send({ type: 'settings.set', patch: { 'chat.dockPlatforms': ['twitch', 'kick', 'youtube', 'rumble'].filter(x => !hideP.has(x)) } }); };
  function paintPlat() { const t = sendTargets[tIdx] || 'all'; const b = $('plat'); b.textContent = t === 'all' ? 'ALL' : P[t].tag; b.className = t; b.title = t === 'all' ? 'Send to every platform IXC can reply on (click to change)' : 'Send to ' + P[t].name; }
  $('plat').onclick = () => { tIdx = (tIdx + 1) % sendTargets.length; paintPlat(); };
  // ---------- TTS ----------
  function paintTts() {
    if (!tts) return; const s = tts.settings || {};
    $('ttsBtn').textContent = s.enabled ? '🔊 Voice on' : '🔈 Voice off'; $('ttsBtn').classList.toggle('on', !!s.enabled);
    $('pauseBtn').textContent = tts.paused ? '▶' : '⏸'; $('pauseBtn').title = tts.paused ? 'Resume the chat voice' : 'Pause the chat voice'; $('pauseBtn').classList.toggle('on', !!tts.paused);
    if (document.activeElement !== $('ttsVoice')) $('ttsVoice').value = s.voice;
    const n = (tts.queue || []).length; $('qn').textContent = (tts.current ? '🗣 ' + (tts.current.user || '') : '') + (n ? ' · ' + n + ' waiting' : '') + (tts.players === 0 && s.enabled ? ' · ⚠ voice source not in OBS' : ''); }
  $('ttsBtn').onclick = () => link.send({ type: 'settings.set', patch: { 'tts.on': !(tts && tts.settings.enabled) } });
  $('pauseBtn').onclick = () => link.send({ type: tts && tts.paused ? 'tts.resume' : 'tts.pause' });
  $('skipBtn').onclick = () => link.send({ type: 'tts.skip' });
  $('ttsVoice').onchange = () => link.send({ type: 'settings.set', patch: { 'tts.voice': $('ttsVoice').value } });
  function fillVoices() { $('ttsVoice').innerHTML = voices.map(v => `<option value="${esc(v.key)}">${esc(v.label)}</option>`).join(''); paintTts(); }
  const openApp = (hash) => window.open('/app/' + (hash || ''), 'ixc-app', 'width=1240,height=860');
  $('appBtn').onclick = () => openApp('');
  // ---------- click a message: reply / voice / never read / hide ----------
  const menu = $('menu'); let menuFor = null;
  list.addEventListener('click', (e) => { const el = e.target.closest('.msg'); if (!el || el.classList.contains('sys') || el.classList.contains('alert')) return;
    menuFor = { p: el.dataset.p, name: el.dataset.name, login: el.dataset.login, text: el.querySelector('.text') ? el.querySelector('.text').textContent : '' };
    menu.innerHTML = `<div class="h">${esc(P[menuFor.p] ? P[menuFor.p].name : '')} · <b>${esc(menuFor.name)}</b></div>
      <button data-a="reply">↩ Reply to ${esc(menuFor.name)}</button><button data-a="voice">🎙 Choose a voice for ${esc(menuFor.name)}…</button>
      <button data-a="never">🔇 Never read ${esc(menuFor.name)} out loud</button><button data-a="hide">🚫 Hide ${esc(menuFor.name)} everywhere</button><button data-a="copy">📋 Copy message</button>`;
    const r = el.getBoundingClientRect(); menu.classList.add('show'); const mw = menu.offsetWidth, mh = menu.offsetHeight;
    menu.style.left = Math.max(6, Math.min(window.innerWidth - mw - 6, e.clientX - 20)) + 'px'; menu.style.top = Math.max(6, Math.min(window.innerHeight - mh - 6, r.bottom + 4)) + 'px'; });
  document.addEventListener('click', (e) => { if (!e.target.closest('#menu') && !e.target.closest('.msg')) menu.classList.remove('show'); });
  menu.onclick = async (e) => { const a = e.target.closest('button') && e.target.closest('button').dataset.a; if (!a || !menuFor) return; menu.classList.remove('show'); const f = menuFor;
    if (a === 'reply') { const i = sendTargets.indexOf(f.p); tIdx = i >= 0 ? i : 0; paintPlat(); $('msgIn').value = '@' + f.name + ' ' + $('msgIn').value.replace(/^@\S+\s*/, ''); $('msgIn').focus(); }
    else if (a === 'voice') openApp('#voices?user=' + encodeURIComponent(f.name) + '&p=' + f.p);
    else if (a === 'never') { const l = (settings['tts.neverSpeak'] || []).concat([f.name]); const r = await IXC.api('/api/settings', { patch: { 'tts.neverSpeak': l } }); toast(r.ok ? f.name + ' will never be read out' : r.error, !r.ok); if (r.ok) settings = r.values; }
    else if (a === 'hide') { if (!await UI.confirmBox('Hide ' + f.name + ' from this panel, the overlay and the voice?', 'Hide')) return; const l = (settings['chat.filters.blacklist'] || []).concat([f.name]); const r = await IXC.api('/api/settings', { patch: { 'chat.filters.blacklist': l } }); toast(r.ok ? f.name + ' is hidden (undo in IXC > Chat filters)' : r.error, !r.ok); if (r.ok) settings = r.values; }
    else if (a === 'copy') { try { await navigator.clipboard.writeText(f.text); toast('Copied'); } catch { toast('Copy is not allowed here', true); } } };
  // ---------- reply box with ! and @ suggestions ----------
  let CMDS = [], USERS = [], sugItems = [], sel = 0; const input = $('msgIn'), sug = $('sug');
  async function send() { const text = input.value.trim(); if (!text) return; const to = sendTargets[tIdx] || 'all'; input.value = ''; hideSug();
    const r = await link.ask({ type: 'chat.send', platform: to, message: text }, 'chat.sent', 15000); const res = r.results || [];
    const bad = res.filter(x => !x.ok); if (!res.length) toast('Not sent: ' + (r.error || 'IXC is not running'), true); else if (bad.length) toast('Not sent to ' + bad.map(x => (P[x.platform] ? P[x.platform].name : x.platform) + ': ' + x.error).join('; '), true); }
  $('sendBtn').onclick = send;
  function hideSug() { sug.classList.remove('show'); sugItems = []; }
  function showSug() {
    const v = input.value, at = v.lastIndexOf(' ') + 1, word = v.slice(at);
    if (/^!/.test(v) && at === 0) sugItems = CMDS.filter(c => c.toLowerCase().startsWith(word.toLowerCase())).slice(0, 30).map(c => ({ t: c, s: 'command' }));
    else if (/^@/.test(word)) sugItems = USERS.filter(u => u.name.toLowerCase().startsWith(word.slice(1).toLowerCase())).slice(0, 30).map(u => ({ t: '@' + u.name, s: P[u.platform] ? P[u.platform].name : '' }));
    else sugItems = [];
    if (!sugItems.length) return hideSug(); sel = 0;
    sug.innerHTML = sugItems.map((x, i) => `<div class="s ${i === sel ? 'sel' : ''}" data-i="${i}">${esc(x.t)}<small>${esc(x.s)}</small></div>`).join(''); sug.classList.add('show'); }
  function pick(i) { const v = input.value, at = v.lastIndexOf(' ') + 1; input.value = v.slice(0, at) + sugItems[i].t + ' '; hideSug(); input.focus(); }
  sug.onclick = (e) => { const s = e.target.closest('.s'); if (s) pick(+s.dataset.i); };
  input.addEventListener('input', () => { if (/^!|(^|\s)@/.test(input.value) && !CMDS.length) link.send({ type: 'chat.suggest' }); showSug(); });
  input.addEventListener('keydown', (e) => {
    if (sug.classList.contains('show')) { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + sugItems.length) % sugItems.length; sug.querySelectorAll('.s').forEach((s, i) => s.classList.toggle('sel', i === sel)); return; }
      if (e.key === 'Tab' || (e.key === 'Enter' && sugItems.length)) { e.preventDefault(); pick(sel); return; } if (e.key === 'Escape') { hideSug(); return; } }
    if (e.key === 'Enter') { e.preventDefault(); send(); } });
  // ---------- connection ----------
  const link = IXC.connect({ role: 'chat', topics: ['chat', 'tts', 'viewers', 'settings', 'reload'], onState: (up) => { $('conn').classList.toggle('show', !up); if (up) link.send({ type: 'chat.suggest' }); }, on: (m) => {
    switch (m.type) {
      case 'chat.history': list.innerHTML = ''; (m.messages || []).forEach(add); follow = true; toBottom(); break;
      case 'chat.msg': add(m.m); break;
      case 'chat.del': del(m.platform, m.id, m.login); break;
      case 'chat.clear': list.querySelectorAll('.msg[data-p="' + m.platform + '"]').forEach(el => el.remove()); break;
      case 'chat.reply': if (m.error) sys((P[m.platform] ? P[m.platform].name : '') + ': ' + (m.text ? '"' + m.text + '" was not sent - ' : '') + m.error, true); else if (m.text) sys('IXC: ' + m.text); break;
      case 'chat.status': plats = m.platforms || {}; paintChips(); break;
      case 'viewers': viewers = m; paintChips(); break;
      case 'tts.state': tts = m; paintTts(); break;
      case 'tts.voices': voices = m.voices || []; fillVoices(); break;
      case 'chat.suggest': CMDS = m.commands || []; USERS = m.users || []; break;
      case 'settings.all': settings = m.values || {}; hideP = new Set(['twitch', 'kick', 'youtube', 'rumble'].filter(p => !(settings['chat.dockPlatforms'] || []).includes(p))); paintChips(); break;
      case 'settings': settings[m.key] = m.value; break;
      case 'error': toast(m.error, true); break;
    } } });
})();
</script>
</body>
</html>
